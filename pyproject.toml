# Draft only: this file is not used by the outer hermes-agent checkout.
# If ai_glasses_memory_assistant becomes its own repo root, rename/copy this
# to pyproject.toml and re-check pins before publishing or deploying.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-glasses-memory-assistant"
version = "0.1.0"
description = "Local AI glasses personal memory assistant prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai",
]

[project.optional-dependencies]
fastapi = [
  "fastapi",
  "pydantic",
  "uvicorn",
]
tts = [
  "edge-tts",
]
voice = [
  "funasr",
]
dev = [
  "pytest",
]

[project.scripts]
ai-glasses-memory-assistant = "ai_glasses_memory_assistant.server:main"
ai-glasses-memory-assistant-fastapi = "ai_glasses_memory_assistant.app:main"

[tool.setuptools]
packages = [
  "ai_glasses_memory_assistant",
  "ai_glasses_memory_assistant.evals",
]

[tool.setuptools.package-dir]
ai_glasses_memory_assistant = "."

[tool.setuptools.package-data]
ai_glasses_memory_assistant = [
  "static/*.html",
  "static/*.css",
  "static/*.js",
  "evals/*.jsonl",
  "docs/context/*.md",
]
