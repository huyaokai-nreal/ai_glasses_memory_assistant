[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-glasses-memory-assistant"
version = "0.1.0"
description = "Local AI glasses personal memory assistant prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai",
]

[project.optional-dependencies]
tts = [
  "edge-tts",
]
voice = [
  "funasr",
]
dev = [
  "pytest",
]

[project.scripts]
ai-glasses-memory-assistant = "ai_glasses_memory_assistant.server:main"

[tool.setuptools]
packages = [
  "ai_glasses_memory_assistant",
  "ai_glasses_memory_assistant.evals",
]

[tool.setuptools.package-data]
ai_glasses_memory_assistant = [
]
