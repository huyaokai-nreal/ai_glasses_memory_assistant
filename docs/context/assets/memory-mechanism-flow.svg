<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">记忆机制流程图</title>
  <desc id="desc">展示用户输入如何变成候选记忆，经过门控、去重、写库、召回和审计。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526071; }
      .box { fill: #ffffff; stroke: #cfd7e6; stroke-width: 2; rx: 14; }
      .input { fill: #eef6ff; stroke: #4e86c6; }
      .gate { fill: #fff7e8; stroke: #c6932d; }
      .store { fill: #effaf1; stroke: #5c9d62; }
      .warn { fill: #fff1f1; stroke: #c66b6b; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3d4a5c; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #59677a; }
      .arrow { stroke: #66758a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8793a5; stroke-width: 2; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#66758a"/>
    </marker>
  </defs>
  <rect class="bg" width="1180" height="760"/>
  <text class="title" x="58" y="55">个人记忆机制：从一句话到可追溯长期记忆</text>
  <text class="sub" x="58" y="84">重点不是全量保存聊天，而是保存有价值、可解释、可更新的个人上下文。</text>

  <rect class="box input" x="70" y="135" width="220" height="130"/>
  <text class="label" x="100" y="174">输入来源</text>
  <text class="body" x="100" y="204">网页聊天</text>
  <text class="body" x="100" y="228">手动导入</text>
  <text class="body" x="100" y="252">continuous_capture</text>

  <rect class="box" x="350" y="135" width="230" height="130"/>
  <text class="label" x="380" y="174">候选记忆</text>
  <text class="body" x="380" y="204">kind</text>
  <text class="body" x="380" y="228">memory_type</text>
  <text class="body" x="380" y="252">confidence / reason</text>

  <rect class="box gate" x="640" y="115" width="250" height="170"/>
  <text class="label" x="670" y="154">写入门控</text>
  <text class="body" x="670" y="184">空内容 / 问句拒绝</text>
  <text class="body" x="670" y="208">临时上下文拒绝</text>
  <text class="body" x="670" y="232">敏感信息需确认</text>
  <text class="body" x="670" y="256">低置信度拒绝</text>

  <rect class="box store" x="960" y="135" width="170" height="130"/>
  <text class="label" x="990" y="174">保存</text>
  <text class="body" x="990" y="204">SQLite memories</text>
  <text class="body" x="990" y="228">按 user_id 隔离</text>
  <text class="body" x="990" y="252">active 状态可召回</text>

  <path class="arrow" d="M290 200 L350 200"/>
  <path class="arrow" d="M580 200 L640 200"/>
  <path class="arrow" d="M890 200 L960 200"/>

  <rect class="box warn" x="640" y="340" width="250" height="115"/>
  <text class="label" x="670" y="379">待确认 / 拒绝</text>
  <text class="body" x="670" y="409">requires_confirmation</text>
  <text class="body" x="670" y="433">rejected + reason</text>
  <path class="dash" d="M765 285 L765 340"/>

  <rect class="box" x="955" y="340" width="175" height="115"/>
  <text class="label" x="985" y="379">去重更新</text>
  <text class="body" x="985" y="409">相似记忆合并证据</text>
  <text class="body" x="985" y="433">旧记忆 superseded</text>
  <path class="dash" d="M1045 265 L1045 340"/>

  <rect class="box" x="70" y="530" width="245" height="135"/>
  <text class="label" x="100" y="569">召回 gate</text>
  <text class="body" x="100" y="599">planner 判断是否需要</text>
  <text class="body" x="100" y="623">profile / event / 时间 / 位置</text>
  <text class="body" x="100" y="647">普通问题不默认读记忆</text>

  <rect class="box" x="390" y="530" width="245" height="135"/>
  <text class="label" x="420" y="569">注入当前 turn</text>
  <text class="body" x="420" y="599">作为背景上下文</text>
  <text class="body" x="420" y="623">不是新用户指令</text>
  <text class="body" x="420" y="647">不修改 system prompt</text>

  <rect class="box" x="710" y="530" width="245" height="135"/>
  <text class="label" x="740" y="569">回复与审计</text>
  <text class="body" x="740" y="599">返回 reply/debug</text>
  <text class="body" x="740" y="623">记录 saved/rejected/job</text>
  <text class="body" x="740" y="647">chat_audit.jsonl 可复盘</text>

  <path class="arrow" d="M960 245 C830 500 400 455 315 560"/>
  <path class="arrow" d="M315 598 L390 598"/>
  <path class="arrow" d="M635 598 L710 598"/>
</svg>
