<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Demo Pipeline 总览</title>
  <desc id="desc">展示聊天、离线导入、连续输入、周报和提醒检查如何进入统一管道。</desc>
  <defs>
    <style>
      .bg { fill: #fbfbfd; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #566579; }
      .lane { fill: #ffffff; stroke: #d5dce8; stroke-width: 2; rx: 16; }
      .chat { fill: #edf6ff; stroke: #4e86c6; }
      .import { fill: #fff8e8; stroke: #c79a38; }
      .capture { fill: #f4efff; stroke: #8a70c9; }
      .core { fill: #effaf1; stroke: #5c9d62; }
      .output { fill: #fff1f1; stroke: #c66b6b; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3d4a5c; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b6878; }
      .arrow { stroke: #66758a; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8793a5; stroke-width: 2; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#66758a"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="820"/>
  <text class="title" x="58" y="55">统一 Pipeline：多来源输入只走一条长期记忆管道</text>
  <text class="sub" x="58" y="84">输入端负责采集，长期记忆的分类、门控、去重、写入和审计统一处理。</text>

  <rect class="lane chat" x="60" y="130" width="270" height="145"/>
  <text class="label" x="90" y="168">聊天入口</text>
  <text class="body" x="90" y="198">POST /api/chat</text>
  <text class="body" x="90" y="222">planner</text>
  <text class="body" x="90" y="246">fast path 或 AIAgent</text>

  <rect class="lane import" x="60" y="335" width="270" height="145"/>
  <text class="label" x="90" y="373">离线导入</text>
  <text class="body" x="90" y="403">POST /api/memory/import</text>
  <text class="body" x="90" y="427">text 或 JSON items</text>
  <text class="body" x="90" y="451">生成 ingestion_id</text>

  <rect class="lane capture" x="60" y="540" width="270" height="165"/>
  <text class="label" x="90" y="578">连续输入</text>
  <text class="body" x="90" y="608">/capture/start</text>
  <text class="body" x="90" y="632">/capture/append</text>
  <text class="body" x="90" y="656">/capture/stop</text>
  <text class="body" x="90" y="680">汇总后进入导入管道</text>

  <rect class="lane core" x="430" y="230" width="330" height="330"/>
  <text class="label" x="470" y="270">统一 ingestion pipeline</text>
  <text class="body" x="470" y="305">1. 标准化来源和时间</text>
  <text class="body" x="470" y="333">2. 生成候选记忆</text>
  <text class="body" x="470" y="361">3. privacy / quality gate</text>
  <text class="body" x="470" y="389">4. 去重或合并 evidence</text>
  <text class="body" x="470" y="417">5. 写入 SQLite memories</text>
  <text class="body" x="470" y="445">6. 更新 debug / audit</text>
  <text class="small" x="470" y="500">核心原则：不要让新输入端绕过门控直接写库。</text>

  <path class="arrow" d="M330 202 C370 210 392 250 430 300"/>
  <path class="arrow" d="M330 408 L430 408"/>
  <path class="arrow" d="M330 622 C382 600 390 520 430 488"/>

  <rect class="lane output" x="850" y="150" width="280" height="120"/>
  <text class="label" x="880" y="188">聊天输出</text>
  <text class="body" x="880" y="218">reply / debug</text>
  <text class="body" x="880" y="242">recalled / saved / job</text>

  <rect class="lane output" x="850" y="345" width="280" height="120"/>
  <text class="label" x="880" y="383">周报草稿</text>
  <text class="body" x="880" y="413">GET /api/weekly-report</text>
  <text class="body" x="880" y="437">按项目启发式分组</text>

  <rect class="lane output" x="850" y="540" width="280" height="120"/>
  <text class="label" x="880" y="578">提醒检查</text>
  <text class="body" x="880" y="608">GET /api/reminders/check</text>
  <text class="body" x="880" y="632">未来 24 小时 task</text>

  <path class="arrow" d="M760 330 C810 295 812 230 850 210"/>
  <path class="arrow" d="M760 408 L850 408"/>
  <path class="arrow" d="M760 488 C812 512 814 575 850 600"/>

  <rect class="lane" x="430" y="650" width="700" height="62"/>
  <text class="label" x="460" y="688">当前 demo 边界</text>
  <text class="body" x="650" y="688">job 和 capture 仍是进程内状态；提醒是手动检查；周报是启发式草稿。</text>
</svg>
