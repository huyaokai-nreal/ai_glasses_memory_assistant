<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Glasses Memory Assistant</title>
    <link rel="stylesheet" href="/static/styles.css?v=unified-audio-3" />
  </head>
  <body>
    <main class="shell">
      <section class="chat-pane" aria-label="聊天">
        <header class="topbar" aria-label="会话状态">
          <div>
            <h1>AI 眼镜记忆助手</h1>
            <p>局域网浏览器体验 · 当前体验者的数据独立保存</p>
          </div>
          <div class="topbar-actions">
            <button id="user-switch" class="ghost" type="button" data-tooltip="切换体验者">体验者</button>
            <button id="speaker-enroll-button" class="ghost" type="button" data-tooltip="管理当前用户的参考声纹">声纹设置</button>
            <button id="voice-toggle" class="ghost" type="button" aria-pressed="true" data-tooltip="关闭语音播报">播报开</button>
            <button id="location-refresh" class="ghost" type="button" data-tooltip="刷新当前位置">定位</button>
            <button id="memory-toggle" class="ghost memory-toggle" type="button" data-tooltip="打开或收起记忆面板">记忆</button>
            <button id="debug-toggle" class="ghost" type="button" aria-controls="debug-pane" aria-expanded="false" data-tooltip="查看本次对话诊断">Debug</button>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <p id="voice-status" class="voice-status" aria-live="polite">等待语音输入</p>
        <section class="ambient-bar" aria-label="收音待机">
          <div>
            <strong id="ambient-mode-label">收音待机未启动</strong>
          <p id="ambient-status">准备开始收音；原始 PCM 不持久化。</p>
          </div>
          <div class="ambient-actions">
            <button id="ambient-standby-toggle" class="ghost" type="button" data-tooltip="开启或停止全天收音待机">开启全天待机</button>
          </div>
        </section>
        <form id="chat-form" class="composer">
          <button
            id="markdown-import-button"
            class="composer-icon-button"
            type="button"
            aria-label="添加 Markdown 文件"
            data-tooltip="添加 Markdown 文件"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <path d="M17 8l-5-5-5 5"></path>
              <path d="M12 3v12"></path>
            </svg>
            <span id="markdown-import-button-text" class="sr-only">添加 Markdown 文件</span>
          </button>
          <input id="markdown-import-input" class="sr-only" type="file" accept=".md,text/markdown,text/plain" />
          <input
            id="message-input"
            type="text"
            autocomplete="off"
            placeholder="输入一句话，例如：记住我今天和 Alex 在虹桥吃了拉面"
          />
          <button id="send-button" type="submit" aria-label="发送" data-tooltip="发送消息">发送</button>
        </form>
      </section>

      <aside id="memory-pane" class="memory-pane" aria-label="记忆管理">
        <div class="pane-header">
          <div>
            <h2>当前记忆</h2>
            <p id="memory-count">0 条</p>
          </div>
          <button id="refresh-memory" class="ghost" type="button" data-tooltip="刷新记忆列表">刷新</button>
        </div>
        <div id="memory-subject-filter" class="memory-subject-filter" role="group" aria-label="按人物筛选记忆">
          <button type="button" data-subject-filter="all" aria-pressed="true">全部</button>
          <button type="button" data-subject-filter="__self__" aria-pressed="false">我</button>
        </div>
        <form id="memory-form" class="memory-form">
          <label class="field-label" for="memory-kind">记忆类型</label>
          <select id="memory-kind">
            <option value="event">日常事件</option>
            <option value="profile">长期画像</option>
          </select>
          <label class="field-label" for="memory-subject">记忆归属</label>
          <select id="memory-subject">
            <option value="__self__">我</option>
            <option value="__new__">新人物</option>
          </select>
          <div id="memory-new-subject-field" class="memory-new-subject-field" hidden>
            <label class="field-label" for="memory-new-subject-name">人物姓名</label>
            <input id="memory-new-subject-name" type="text" maxlength="80" autocomplete="off" placeholder="输入人物姓名" />
          </div>
          <textarea id="memory-input" rows="3" placeholder="手动新增一条记忆"></textarea>
          <button type="submit">保存记忆</button>
        </form>
        <div id="memory-list" class="memory-list"></div>
      </aside>

      <aside id="debug-pane" class="debug-pane" aria-label="Debug 面板">
        <div class="pane-header">
          <div>
            <h2>Debug</h2>
            <p>最近一次 query 的执行轨迹</p>
          </div>
          <div class="debug-actions">
            <button id="view-audit" class="ghost" type="button" data-tooltip="查看最近审计记录">审计</button>
            <button id="export-audit" class="ghost" type="button" data-tooltip="导出审计日志">导出</button>
            <button id="clear-debug" class="ghost" type="button" data-tooltip="清空调试内容">清空</button>
            <button id="close-debug" class="ghost" type="button" aria-label="关闭 Debug 面板" data-tooltip="关闭 Debug 面板">关闭</button>
          </div>
        </div>
        <pre id="debug-output" class="debug-output">等待用户发送 query...</pre>
      </aside>
    </main>
    <div id="user-select-modal" class="modal-backdrop" hidden>
      <section class="modal-card user-select-card" aria-label="选择体验者">
        <header class="modal-header">
          <div>
            <h2>选择体验者</h2>
            <p>记忆、声纹、capture 和审计记录将按此 ID 隔离。</p>
          </div>
        </header>
        <form id="user-select-form" class="modal-body user-select-form">
          <label class="field-label" for="user-id-input">体验者 ID</label>
          <input id="user-id-input" type="text" maxlength="64" autocomplete="username" placeholder="例如：demo-user-01" required />
          <p id="user-select-error" class="speaker-enroll-status" aria-live="polite"></p>
          <footer class="modal-actions">
            <button type="submit">进入</button>
          </footer>
        </form>
      </section>
    </div>
    <div id="speaker-enroll-modal" class="modal-backdrop" hidden>
      <section class="modal-card" aria-label="声纹录入">
        <header class="modal-header">
          <div>
            <h2>用户声纹录入</h2>
            <p id="speaker-enroll-summary">当前还没有参考声纹。</p>
          </div>
          <button id="speaker-enroll-close" class="ghost" type="button" data-tooltip="关闭声纹录入">关闭</button>
        </header>
        <div class="modal-body">
          <p id="speaker-enroll-progress" class="speaker-enroll-progress">当前进度：0 / 3</p>
          <p class="speaker-fixed-phrase-label">请对着麦克风读这句固定短句：</p>
          <blockquote id="speaker-enroll-phrase" class="speaker-fixed-phrase">你好 Hermes，这是我的参考声纹样本。</blockquote>
          <p id="speaker-enroll-status" class="speaker-enroll-status">点击开始录入后，说完短句即可；暂时不录也不影响文字聊天。</p>
        </div>
        <footer class="modal-actions">
          <button id="speaker-enroll-start" type="button">开始录入</button>
          <button id="speaker-enroll-retry" class="ghost" type="button">重新录入</button>
          <button id="speaker-enroll-cancel" class="ghost" type="button">稍后再录，先用文字聊天</button>
        </footer>
      </section>
    </div>
    <div id="debug-backdrop" class="debug-backdrop" hidden></div>
    <div id="button-tooltip" class="button-tooltip" role="tooltip" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/static/app.js?v=unified-audio-3"></script>
  </body>
</html>
